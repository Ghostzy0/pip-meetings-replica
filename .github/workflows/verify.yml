name: Verify exported Meetings product
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 35
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        edition: ["baseline"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Speech setup receipt and path regressions
        run: python3 -B scripts/test-speech-setup.py
      - name: Native product regressions
        run: scripts/test-native.sh '${{ matrix.edition }}'
      - name: Package selected edition
        run: scripts/build-native.sh '${{ matrix.edition }}'
      - name: Verify audio capture library
        run: swift test --package-path native/tools/audiotap --jobs 2
